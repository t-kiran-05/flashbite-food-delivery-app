# ==============================================================================
# FlashBite Multi-Tenant Enterprise Ordering & Operational System
# Full-Stack Local Docker Compose (KRaft Mode Kafka, Redis, MongoDB, Backend)
# ==============================================================================
# Usage from project root:
#   docker compose up --build
# ==============================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: flashbite_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - flashbite_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Live Pub/Sub Counter
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flashbite_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flashbite_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Apache Kafka (KRaft Mode - No ZooKeeper Dependency)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: flashbite_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6

  # ----------------------------------------------------------------------------
  # 4. FlashBite Node.js Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./merged-backend
      dockerfile: Dockerfile
    container_name: flashbite_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://mongo:27017/flashbite"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "flashbite-backend-docker"
      KAFKA_SSL: "false"
      JWT_SECRET: "flashbite_local_docker_jwt_secret_key_12345"
      CLIENT_URL: "http://localhost:3000"
      FRONTEND_ORIGIN: "http://localhost:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  flashbite_mongo_data:
    driver: local
  flashbite_redis_data:
    driver: local

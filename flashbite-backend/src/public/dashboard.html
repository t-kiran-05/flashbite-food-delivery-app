  <header>
    <a href="#" class="brand">
      ⚡ FlashBite <span>Dashboard</span>
    </a>
    <span class="tenant-badge" id="tenantLabel">Tenant: Authorizing...</span>
  </header>

  <main>
    <div class="status-bar">
      <span id="statusDot"></span>
      <span>Socket.IO: <strong id="statusText" style="color: var(--text);">Authenticating...</strong></span>
      <span>|</span>
      <span>Total Orders Streamed: <strong id="orderCount" style="color: var(--primary);">0</strong></span>
    </div>

    <div class="dashboard-header">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700;">Live Multi-Tenant Orders Queue</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Streamed via Kafka & Redis Engine</p>
      </div>
    </div>

    <div id="ordersContainer" class="orders-grid">
      <div class="placeholder" id="placeholder">Waiting for incoming order events...</div>
    </div>

  <script>
    // 1. Retrieve JWT token from storage or URL override
    const urlParams = new URLSearchParams(window.location.search);
    let token = urlParams.get('token') || localStorage.getItem('jwt_token');

    if (!token) {
      alert('Authentication required. Redirecting to login...');
      window.location.href = '/login.html';
    } else {
      localStorage.setItem('jwt_token', token);
    }

    // 2. Decode JWT payload to present Tenant ID
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(window.atob(base64));
      } catch (e) {
        return null;
      }
    }

    const payload = parseJwt(token);
    if (payload && payload.tenantId) {
      document.getElementById('tenantLabel').textContent = 'Tenant: ' + payload.tenantId;
    }

    // 3. Connect to Socket.IO with handshake JWT authentication
    const socket = io({
      auth: { token },
      transports: ['websocket', 'polling']
    });

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const orderCount = document.getElementById('orderCount');
    const ordersContainer = document.getElementById('ordersContainer');
    const placeholder = document.getElementById('placeholder');
    let totalCount = 0;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    socket.on('connect', () => {
      statusDot.className = 'connected';
      statusText.textContent = 'Connected (' + socket.id + ')';
    });

    socket.on('disconnect', () => {
      statusDot.className = '';
      statusText.textContent = 'Disconnected';
    });

    socket.on('connect_error', (err) => {
      statusDot.className = '';
      statusText.textContent = 'Auth Error: ' + err.message;
    });

    socket.on('newOrder', (order) => {
      if (placeholder && placeholder.parentNode) placeholder.remove();
      
      totalCount++;
      orderCount.textContent = totalCount;

      const card = document.createElement('div');
      card.className = 'order-card';

      const status = (order.status || 'placed').toLowerCase();
      let statusClass = 'status-placed';
      if (status === 'preparing') statusClass = 'status-preparing';
      if (status === 'delivered') statusClass = 'status-delivered';

      const orderId = escapeHtml(String(order.orderId || order._id || 'N/A'));
      const customer = escapeHtml(String(order.customerId || order.customerName || 'Guest'));
      const prepTime = escapeHtml(String(order.prepTimeSeconds || order.prepTime || 0));
      const items = Array.isArray(order.items) 
        ? escapeHtml(order.items.join(', ')) 
        : escapeHtml(String(order.items || 'Standard Meal'));

      card.innerHTML = `
        <div class="order-card-header">
          <strong style="font-size:0.95rem;">Order #${orderId}</strong>
          <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
        </div>
        <p style="font-size:0.9rem;"><strong>Customer:</strong> ${customer}</p>
        <p style="font-size:0.85rem; color:var(--text-muted); line-height: 1.4;">${items}</p>
        <div style="font-size:0.8rem; color:var(--text-muted); display:flex; justify-content:space-between; margin-top: auto; padding-top: 8px;">
          <span>Prep Time: ${prepTime}s</span>
          <span>${new Date().toLocaleTimeString()}</span>
        </div>
      `;

      ordersContainer.prepend(card);

      while (ordersContainer.children.length > 50) {
        ordersContainer.removeChild(ordersContainer.lastChild);
      }
    });
  </script>
</body>
</html>
